<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="机器翻译 FIFO 内存淘汰示意">
  <defs>
    <linearGradient id="fcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282c34"/>
      <stop offset="1" stop-color="#21252b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="300" rx="10" fill="url(#fcBg)"/>
  <text x="24" y="34" font-family="monospace" font-size="15" fill="#abb2bf">内存 M = 3：队列管顺序，in_mem 管存在性</text>
  <!-- 文章单词流 -->
  <g font-family="monospace" font-size="14" text-anchor="middle">
    <text x="70"  y="80" fill="#5c6370">1</text>
    <text x="110" y="80" fill="#5c6370">2</text>
    <text x="150" y="80" fill="#5c6370">1</text>
    <text x="190" y="80" fill="#98c379">3</text>
    <text x="230" y="80" fill="#e06c75">4</text>
    <text x="270" y="80" fill="#5c6370">…</text>
  </g>
  <text x="150" y="52" font-family="monospace" font-size="12" fill="#5c6370" text-anchor="middle">文章单词（按序读取）</text>
  <!-- 内存三个格子（队列） -->
  <g font-family="monospace" font-size="16" text-anchor="middle">
    <rect x="120" y="150" width="60" height="46" rx="6" fill="#21252b" stroke="#61afef"/><text x="150" y="179" fill="#61afef">1</text>
    <rect x="190" y="150" width="60" height="46" rx="6" fill="#21252b" stroke="#61afef"/><text x="220" y="179" fill="#61afef">2</text>
    <rect x="260" y="150" width="60" height="46" rx="6" fill="#21252b" stroke="#98c379"/><text x="290" y="179" fill="#98c379">3</text>
  </g>
  <text x="220" y="136" font-family="monospace" font-size="12" fill="#5c6370" text-anchor="middle">内存（队首最旧 ← 队尾最新）</text>
  <!-- 读 1：命中 -->
  <path d="M150 92 C 140 112, 146 132, 150 146" fill="none" stroke="#5c6370" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="118" y="122" font-family="monospace" font-size="11" fill="#5c6370">读 1：命中 ✓</text>
  <!-- 读 3：未命中入队尾 -->
  <path d="M190 92 C 260 110, 300 128, 292 146" fill="none" stroke="#98c379" stroke-width="1.5"/>
  <text x="252" y="112" font-family="monospace" font-size="11" fill="#98c379">读 3：查词典，入队</text>
  <!-- 读 4：满了 → 淘汰队首 1 -->
  <path d="M230 92 C 200 200, 160 230, 128 224" fill="none" stroke="#e06c75" stroke-width="1.5"/>
  <text x="96" y="252" font-family="monospace" font-size="12" fill="#e06c75" text-anchor="start">读 4：内存满 → 淘汰队首 1（清 in_mem[1]）→ 4 入队</text>
  <!-- 右侧注释 -->
  <g font-family="monospace" font-size="12">
    <text x="420" y="150" fill="#abb2bf" text-anchor="start">FIFO 置换 = 缓存的雏形</text>
    <text x="420" y="172" fill="#5c6370" text-anchor="start">队列：谁最早进来</text>
    <text x="420" y="190" fill="#5c6370" text-anchor="start">数组：在不在内存</text>
    <text x="420" y="218" fill="#56b6c2" text-anchor="start">这对组合在 BFS 里</text>
    <text x="420" y="236" fill="#56b6c2" text-anchor="start">还会反复出现</text>
  </g>
  <text x="24" y="288" font-family="monospace" font-size="11" fill="#5c6370">NOIP 2010 机器翻译——查词典次数 = 未命中次数</text>
</svg>
