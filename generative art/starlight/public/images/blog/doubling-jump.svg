<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="倍增跳步示意">
  <defs>
    <linearGradient id="djBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282c34"/>
      <stop offset="1" stop-color="#21252b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="300" rx="10" fill="url(#djBg)"/>
  <text x="24" y="34" font-family="monospace" font-size="15" fill="#abb2bf">倍增：跳 1、2、4 步的表，复合出任意 k 步</text>

  <!-- 地面线 -->
  <line x1="40" y1="228" x2="620" y2="228" stroke="#3a3f4b" stroke-width="1.5"/>

  <!-- 弧线：f1 / f2 / f4 -->
  <path d="M 90 192 Q 150 150 210 192" fill="none" stroke="#98c379" stroke-width="2"/>
  <text x="150" y="162" font-family="monospace" font-size="11" fill="#98c379" text-anchor="middle">f1: +1</text>
  <path d="M 90 192 Q 210 70 330 192" fill="none" stroke="#61afef" stroke-width="2"/>
  <text x="210" y="122" font-family="monospace" font-size="11" fill="#61afef" text-anchor="middle">f2 = f1∘f1</text>
  <path d="M 90 192 Q 330 -22 570 192" fill="none" stroke="#c678dd" stroke-width="2"/>
  <text x="330" y="76" font-family="monospace" font-size="11" fill="#c678dd" text-anchor="middle">f4 = f2∘f2</text>

  <!-- 节点 -->
  <g font-family="monospace" font-size="14" text-anchor="middle">
    <circle cx="90"  cy="210" r="16" fill="#61afef"/><text x="90"  y="215" fill="#282c34">1</text>
    <circle cx="210" cy="210" r="16" fill="#98c379"/><text x="210" y="215" fill="#282c34">2</text>
    <circle cx="330" cy="210" r="16" fill="#98c379"/><text x="330" y="215" fill="#282c34">3</text>
    <circle cx="450" cy="210" r="16" fill="#98c379"/><text x="450" y="215" fill="#282c34">4</text>
    <circle cx="570" cy="210" r="16" fill="#98c379"/><text x="570" y="215" fill="#282c34">5</text>
  </g>

  <g font-family="monospace" font-size="13">
    <text x="40" y="262" fill="#abb2bf">fa[j][i] = fa[j−1][ fa[j−1][i] ]——大步由小步复合</text>
    <text x="40" y="286" fill="#e5c07b">「跳 m 步」= 按 m 的二进制逐位查表，m ≤ 10^18 也只要 60 层</text>
  </g>
</svg>
