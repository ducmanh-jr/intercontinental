<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="括号匹配的栈过程示意">
  <defs>
    <linearGradient id="smBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282c34"/>
      <stop offset="1" stop-color="#21252b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="300" rx="10" fill="url(#smBg)"/>
  <text x="24" y="36" font-family="monospace" font-size="15" fill="#abb2bf">s = ( [ ] )</text>
  <g font-family="monospace" font-size="20" text-anchor="middle">
    <text x="60"  y="70" fill="#e06c75">(</text>
    <text x="100" y="70" fill="#e5c07b">[</text>
    <text x="140" y="70" fill="#e5c07b">]</text>
    <text x="180" y="70" fill="#e06c75">)</text>
  </g>
  <!-- 四步栈快照：每读一个字符后栈的内容（底→顶 向上） -->
  <g font-family="monospace" font-size="14" text-anchor="middle">
    <!-- 步骤1: 读 ( 入栈 -->
    <text x="60" y="88" fill="#5c6370" text-anchor="start">读 ( → 入栈</text>
    <rect x="52" y="130" width="24" height="24" rx="4" fill="#e06c75" opacity="0.85"/>
    <text x="64" y="147" fill="#282c34">(</text>
    <!-- 步骤2: 读 [ 入栈 -->
    <text x="150" y="88" fill="#5c6370" text-anchor="start">读 [ → 入栈</text>
    <rect x="142" y="130" width="24" height="24" rx="4" fill="#e06c75" opacity="0.85"/>
    <text x="154" y="147" fill="#282c34">(</text>
    <rect x="142" y="102" width="24" height="24" rx="4" fill="#e5c07b" opacity="0.85"/>
    <text x="154" y="119" fill="#282c34">[</text>
    <!-- 步骤3: 读 ] 栈顶 [ 匹配 → 弹出 -->
    <text x="250" y="88" fill="#98c379" text-anchor="start">读 ] 匹配 [ → 弹</text>
    <rect x="242" y="130" width="24" height="24" rx="4" fill="#e06c75" opacity="0.85"/>
    <text x="254" y="147" fill="#282c34">(</text>
    <rect x="276" y="102" width="24" height="24" rx="4" fill="none" stroke="#e5c07b" stroke-dasharray="4 3"/>
    <text x="288" y="119" fill="#e5c07b">[✕</text>
    <!-- 步骤4: 读 ) 栈顶 ( 匹配 → 弹出，栈空 → 合法 -->
    <text x="390" y="88" fill="#98c379" text-anchor="start">读 ) 匹配 ( → 弹</text>
    <rect x="382" y="102" width="24" height="24" rx="4" fill="none" stroke="#e06c75" stroke-dasharray="4 3"/>
    <text x="394" y="119" fill="#e06c75">(✕</text>
    <text x="440" y="147" fill="#98c379">栈空 ✓ 合法</text>
  </g>
  <!-- 右侧：两种非法情形 -->
  <g font-family="monospace" font-size="13">
    <text x="500" y="196" fill="#5c6370" text-anchor="start">非法情形 1：</text>
    <text x="500" y="216" fill="#e06c75" text-anchor="start">) 来了栈空</text>
    <text x="500" y="236" fill="#5c6370" text-anchor="start">（没欠债却要还）</text>
    <text x="500" y="262" fill="#e06c75" text-anchor="start">非法情形 2：</text>
    <text x="500" y="282" fill="#5c6370" text-anchor="start">扫完栈非空</text>
  </g>
  <text x="24" y="196" font-family="monospace" font-size="13" fill="#abb2bf">左括号 = 欠债入栈</text>
  <text x="24" y="216" font-family="monospace" font-size="13" fill="#abb2bf">右括号 = 还最近一笔债</text>
  <text x="24" y="244" font-family="monospace" font-size="12" fill="#56b6c2">吐泡泡同款：配对成功会升级 o+o→O 继续比</text>
  <text x="24" y="288" font-family="monospace" font-size="11" fill="#5c6370">「最近发生的还没配对的事」就是栈的状态</text>
</svg>
