<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="单调队列优化划段 DP 示意">
  <defs>
    <linearGradient id="mqBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282c34"/>
      <stop offset="1" stop-color="#21252b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="300" rx="10" fill="url(#mqBg)"/>
  <text x="24" y="34" font-family="monospace" font-size="15" fill="#abb2bf">dp[i] = 1 + min{ dp[j] : j ∈ 滑动窗口 }</text>
  <!-- dp 数组 -->
  <g font-family="monospace" font-size="13" text-anchor="middle">
    <rect x="60"  y="80" width="52" height="34" rx="5" fill="#e06c75" opacity="0.85"/><text x="86"  y="102" fill="#282c34">dp1=5</text>
    <rect x="120" y="80" width="52" height="34" rx="5" fill="#e5c07b" opacity="0.85"/><text x="146" y="102" fill="#282c34">dp2=3</text>
    <rect x="180" y="80" width="52" height="34" rx="5" fill="#98c379" opacity="0.85"/><text x="206" y="102" fill="#282c34">dp3=1</text>
    <rect x="240" y="80" width="52" height="34" rx="5" fill="#e5c07b" opacity="0.85"/><text x="266" y="102" fill="#282c34">dp4=3</text>
    <rect x="300" y="80" width="52" height="34" rx="5" fill="#e06c75" opacity="0.85"/><text x="326" y="102" fill="#282c34">dp5=6</text>
    <rect x="360" y="80" width="52" height="34" rx="5" fill="#61afef" opacity="0.85"/><text x="386" y="102" fill="#282c34">dp6=2</text>
    <text x="430" y="102" fill="#5c6370">…</text>
    <rect x="460" y="80" width="52" height="34" rx="5" fill="none" stroke="#56b6c2" stroke-dasharray="4 3"/><text x="486" y="102" fill="#56b6c2">dp[i]</text>
  </g>
  <!-- 窗口框（k=4）：随 i 右移 -->
  <rect x="176" y="66" width="184" height="62" rx="8" fill="none" stroke="#61afef" stroke-width="2"/>
  <text x="268" y="56" font-family="monospace" font-size="12" fill="#61afef" text-anchor="middle">合法转移窗口 [i−k, pr[i]−2]</text>
  <!-- 单调队列（存下标，值递增） -->
  <text x="24" y="176" font-family="monospace" font-size="13" fill="#abb2bf">单调队列（按 dp 值递增，队头即最小）：</text>
  <g font-family="monospace" font-size="13" text-anchor="middle">
    <rect x="210" y="192" width="64" height="34" rx="5" fill="#98c379" opacity="0.85"/><text x="242" y="214" fill="#282c34">3 · dp=1</text>
    <rect x="280" y="192" width="64" height="34" rx="5" fill="#61afef" opacity="0.85"/><text x="312" y="214" fill="#282c34">6 · dp=2</text>
    <text x="382" y="214" fill="#5c6370">← 队尾</text>
    <text x="188" y="214" fill="#98c379">队头 →</text>
  </g>
  <text x="24" y="252" font-family="monospace" font-size="12" fill="#56b6c2">新 j 进队尾：把 dp 更大的老队尾全弹掉（它们永无出头之日）</text>
  <text x="24" y="272" font-family="monospace" font-size="12" fill="#56b6c2">窗口左端右移：过期的队头出队</text>
  <text x="24" y="292" font-family="monospace" font-size="11" fill="#5c6370">每个下标至多进出各一次：O(n²) → O(n)</text>
</svg>
