<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="线段树区间划分示意">
  <defs>
    <linearGradient id="stBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282c34"/>
      <stop offset="1" stop-color="#21252b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="300" rx="10" fill="url(#stBg)"/>
  <text x="24" y="34" font-family="monospace" font-size="15" fill="#abb2bf">线段树：每个节点管一段，询问拆成 O(log n) 个整节点</text>

  <!-- 根 -->
  <rect x="272" y="52" width="96" height="34" rx="7" fill="#21252b" stroke="#61afef" stroke-width="1.5"/>
  <text x="320" y="74" font-family="monospace" font-size="13" fill="#61afef" text-anchor="middle">[1,4] Σ10</text>

  <!-- 第二层 -->
  <rect x="136" y="122" width="88" height="34" rx="7" fill="#21252b" stroke="#3a3f4b" stroke-width="1.5"/>
  <text x="180" y="144" font-family="monospace" font-size="13" fill="#abb2bf" text-anchor="middle">[1,2] Σ4</text>
  <rect x="416" y="122" width="96" height="34" rx="7" fill="#21252b" stroke="#98c379" stroke-width="2.5"/>
  <text x="464" y="144" font-family="monospace" font-size="13" fill="#98c379" text-anchor="middle">[3,4] Σ6</text>
  <text x="520" y="144" font-family="monospace" font-size="10" fill="#e5c07b">lazy:+2 记账</text>

  <!-- 叶 -->
  <g fill="#21252b" stroke="#3a3f4b" stroke-width="1.5">
    <rect x="72"  y="196" width="76" height="34" rx="7"/>
    <rect x="212" y="196" width="76" height="34" rx="7" stroke="#c678dd" stroke-dasharray="5 4"/>
    <rect x="352" y="196" width="76" height="34" rx="7" stroke="#c678dd" stroke-dasharray="5 4"/>
    <rect x="492" y="196" width="76" height="34" rx="7"/>
  </g>
  <g font-family="monospace" font-size="13" text-anchor="middle" fill="#abb2bf">
    <text x="110" y="218">[1] 1</text>
    <text x="250" y="218">[2] 3</text>
    <text x="390" y="218">[3] 4</text>
    <text x="530" y="218">[4] 2</text>
  </g>

  <!-- 边 -->
  <g stroke="#3a3f4b" stroke-width="1.5">
    <line x1="320" y1="86"  x2="180" y2="122"/>
    <line x1="320" y1="86"  x2="464" y2="122"/>
    <line x1="180" y1="156" x2="110" y2="196"/>
    <line x1="180" y1="156" x2="250" y2="196"/>
    <line x1="464" y1="156" x2="390" y2="196"/>
    <line x1="464" y1="156" x2="530" y2="196"/>
  </g>

  <!-- 图例与注解 -->
  <g font-family="monospace" font-size="13">
    <text x="40" y="256" fill="#98c379">询问 [3,4]：恰好一个整节点，直接用 Σ6</text>
    <text x="40" y="278" fill="#c678dd">询问 [2,3]：拆成叶 [2] + 叶 [3] 两段</text>
  </g>
</svg>
