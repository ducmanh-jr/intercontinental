<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="勾股数平方差构造示意">
  <defs>
    <linearGradient id="pyBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282c34"/>
      <stop offset="1" stop-color="#21252b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="300" rx="10" fill="url(#pyBg)"/>
  <text x="24" y="34" font-family="monospace" font-size="15" fill="#abb2bf">勾股数出自平方差：(c−b)(c+b) = x²</text>

  <!-- 直角三角形 x=5 → 5,12,13 -->
  <g stroke="#61afef" stroke-width="2.5" fill="none">
    <line x1="120" y1="230" x2="120" y2="130"/>
    <line x1="120" y1="230" x2="360" y2="230"/>
    <line x1="120" y1="130" x2="360" y2="230" stroke="#e5c07b"/>
  </g>
  <!-- 直角标记 -->
  <path d="M120,212 h16 v18" fill="none" stroke="#5c6370" stroke-width="1.5"/>
  <circle cx="120" cy="230" r="3.5" fill="#61afef"/>
  <circle cx="120" cy="130" r="3.5" fill="#61afef"/>
  <circle cx="360" cy="230" r="3.5" fill="#61afef"/>

  <g font-family="monospace" font-size="14">
    <text x="106" y="185" fill="#61afef" text-anchor="end">x = 5</text>
    <text x="240" y="256" fill="#98c379" text-anchor="middle">b = (x²−1)/2 = 12</text>
    <text x="258" y="170" fill="#e5c07b">c = (x²+1)/2 = 13</text>
  </g>

  <!-- 推导注记 -->
  <g font-family="monospace" font-size="13">
    <text x="420" y="120" fill="#5c6370">奇数 x：令</text>
    <text x="420" y="144" fill="#61afef">c − b = 1</text>
    <text x="420" y="168" fill="#61afef">c + b = x²</text>
    <text x="420" y="196" fill="#abb2bf">两式相加减即得</text>
    <text x="420" y="220" fill="#98c379">b、c 的一对公式</text>
  </g>

  <!-- 偶数情形 -->
  <g font-family="monospace" font-size="13">
    <text x="24" y="284" fill="#5c6370">偶数 x = 2m：取 c−b = 2, c+b = 2m² ⇒ b = m²−1, c = m²+1</text>
  </g>
</svg>
