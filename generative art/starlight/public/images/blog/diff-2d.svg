<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="二维差分四角记账示意">
  <defs>
    <linearGradient id="d2Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282c34"/>
      <stop offset="1" stop-color="#21252b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="300" rx="10" fill="url(#d2Bg)"/>
  <text x="24" y="34" font-family="monospace" font-size="15" fill="#abb2bf">二维差分：矩形修改在四个角记账，前缀和一次还原</text>

  <!-- 网格 4×4，格子 46px -->
  <g stroke="#3a3f4b" stroke-width="1">
    <rect x="60" y="64" width="184" height="184" fill="#21252b"/>
    <line x1="106" y1="64" x2="106" y2="248"/>
    <line x1="152" y1="64" x2="152" y2="248"/>
    <line x1="198" y1="64" x2="198" y2="248"/>
    <line x1="60" y1="110" x2="244" y2="110"/>
    <line x1="60" y1="156" x2="244" y2="156"/>
    <line x1="60" y1="202" x2="244" y2="202"/>
  </g>
  <!-- 修改矩形：格 (2,2)~(3,3) -->
  <rect x="106" y="110" width="92" height="92" fill="#61afef" fill-opacity="0.15" stroke="#61afef" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="152" y="160" font-family="monospace" font-size="13" fill="#61afef" text-anchor="middle">+v</text>

  <!-- 四角记账 -->
  <g font-family="monospace" font-size="11" text-anchor="middle">
    <circle cx="106" cy="110" r="9" fill="#98c379"/><text x="106" y="114" fill="#282c34">+</text>
    <circle cx="198" cy="202" r="9" fill="#98c379"/><text x="198" y="206" fill="#282c34">+</text>
    <circle cx="198" cy="110" r="9" fill="#e06c75"/><text x="198" y="114" fill="#282c34">−</text>
    <circle cx="106" cy="202" r="9" fill="#e06c75"/><text x="106" y="206" fill="#282c34">−</text>
  </g>
  <g font-family="monospace" font-size="11">
    <text x="94" y="98" fill="#98c379" text-anchor="end">(x1,y1) +v</text>
    <text x="210" y="96" fill="#e06c75">(x2+1,y1) −v</text>
    <text x="104" y="224" fill="#e06c75" text-anchor="start">(x1,y2+1) −v</text>
    <text x="210" y="226" fill="#98c379">(x2+1,y2+1) +v</text>
  </g>

  <!-- 右栏：容斥公式 -->
  <g font-family="monospace" font-size="13">
    <text x="310" y="92" fill="#abb2bf">还原 = 二维前缀和：</text>
    <text x="310" y="120" fill="#61afef">S(x,y) = S(x−1,y)</text>
    <text x="330" y="142" fill="#61afef">+ S(x,y−1) − S(x−1,y−1)</text>
    <text x="330" y="164" fill="#61afef">+ d(x,y)</text>
    <text x="310" y="204" fill="#abb2bf">询问窗口 [a..b]×[c..d]：</text>
    <text x="310" y="252" fill="#98c379">= S(b,d) − S(a−1,d)</text>
    <text x="330" y="272" fill="#98c379">− S(b,c−1) + S(a−1,c−1)</text>
  </g>

  <text x="24" y="286" font-family="monospace" font-size="13" fill="#e5c07b">修改 O(1) 记账，O(nm) 一次还原——修改多、最后才看结果的场景</text>
</svg>
