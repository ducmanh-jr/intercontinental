<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="蛇形遍历预生成序列示意">
  <defs>
    <linearGradient id="soBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282c34"/>
      <stop offset="1" stop-color="#21252b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="300" rx="10" fill="url(#soBg)"/>
  <text x="24" y="34" font-family="monospace" font-size="15" fill="#abb2bf">第 1 步：蛇形顺序预生成 idx[]（与业务解耦）</text>
  <!-- 3 行 5 列网格，草莓标 1 -->
  <g font-family="monospace" font-size="14" text-anchor="middle">
    <!-- 行1：左→右 -->
    <rect x="90"  y="60" width="52" height="44" rx="5" fill="#98c379" opacity="0.85"/><text x="116" y="88" fill="#282c34">1</text>
    <rect x="148" y="60" width="52" height="44" rx="5" fill="#21252b" stroke="#5c6370"/><text x="174" y="88" fill="#5c6370">·</text>
    <rect x="206" y="60" width="52" height="44" rx="5" fill="#98c379" opacity="0.85"/><text x="232" y="88" fill="#282c34">1</text>
    <rect x="264" y="60" width="52" height="44" rx="5" fill="#21252b" stroke="#5c6370"/><text x="290" y="88" fill="#5c6370">·</text>
    <rect x="322" y="60" width="52" height="44" rx="5" fill="#98c379" opacity="0.85"/><text x="348" y="88" fill="#282c34">1</text>
    <!-- 行2：右→左 -->
    <rect x="322" y="110" width="52" height="44" rx="5" fill="#21252b" stroke="#5c6370"/><text x="348" y="138" fill="#5c6370">·</text>
    <rect x="264" y="110" width="52" height="44" rx="5" fill="#21252b" stroke="#5c6370"/><text x="290" y="138" fill="#5c6370">·</text>
    <rect x="206" y="110" width="52" height="44" rx="5" fill="#98c379" opacity="0.85"/><text x="232" y="138" fill="#282c34">1</text>
    <rect x="148" y="110" width="52" height="44" rx="5" fill="#21252b" stroke="#5c6370"/><text x="174" y="138" fill="#5c6370">·</text>
    <rect x="90"  y="110" width="52" height="44" rx="5" fill="#21252b" stroke="#5c6370"/><text x="116" y="138" fill="#5c6370">·</text>
    <!-- 行3：左→右 -->
    <rect x="90"  y="160" width="52" height="44" rx="5" fill="#98c379" opacity="0.85"/><text x="116" y="188" fill="#282c34">1</text>
    <rect x="148" y="160" width="52" height="44" rx="5" fill="#21252b" stroke="#5c6370"/><text x="174" y="188" fill="#5c6370">·</text>
    <rect x="206" y="160" width="52" height="44" rx="5" fill="#21252b" stroke="#5c6370"/><text x="232" y="188" fill="#5c6370">·</text>
    <rect x="264" y="160" width="52" height="44" rx="5" fill="#98c379" opacity="0.85"/><text x="290" y="188" fill="#282c34">1</text>
    <rect x="322" y="160" width="52" height="44" rx="5" fill="#21252b" stroke="#5c6370"/><text x="348" y="188" fill="#5c6370">·</text>
  </g>
  <!-- 蛇形箭头 -->
  <path d="M116 54 h232 M348 54 v6 M348 104 h-232 M116 104 v6 M116 154 h232"
        fill="none" stroke="#61afef" stroke-width="2" marker-end="url(#soArrow)"/>
  <defs>
    <marker id="soArrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#61afef"/>
    </marker>
  </defs>
  <!-- 右侧：idx 序列与分天 -->
  <g font-family="monospace" font-size="13">
    <text x="440" y="70" fill="#abb2bf" text-anchor="start">idx = (1,1)(1,2)(1,3)</text>
    <text x="440" y="90" fill="#abb2bf" text-anchor="start">(1,4)(1,5)(2,5)(2,4)…</text>
    <text x="440" y="124" fill="#e5c07b" text-anchor="start">第 2 步：按天切 d 块</text>
    <rect x="440" y="136" width="34" height="22" rx="4" fill="#e5c07b" opacity="0.85"/><text x="457" y="151" fill="#282c34">d</text>
    <rect x="478" y="136" width="34" height="22" rx="4" fill="#e5c07b" opacity="0.85"/><text x="495" y="151" fill="#282c34">d</text>
    <rect x="516" y="136" width="34" height="22" rx="4" fill="#e5c07b" opacity="0.85"/><text x="533" y="151" fill="#282c34">d</text>
    <text x="556" y="151" fill="#5c6370">…</text>
    <text x="440" y="184" fill="#98c379" text-anchor="start">第 3 步：停止条件独立</text>
    <text x="440" y="204" fill="#5c6370" text-anchor="start">成一个小函数判断</text>
  </g>
  <text x="24" y="240" font-family="monospace" font-size="12" fill="#56b6c2">遍历逻辑一次写对，业务逻辑（分天 / 停止）各自单独测</text>
  <text x="24" y="264" font-family="monospace" font-size="11" fill="#5c6370">奇数行从左到右、偶数行从右到左——下标按 (row + col) 的奇偶翻转即可</text>
</svg>
