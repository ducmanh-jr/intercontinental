<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="01 分数规划对偶函数示意">
  <defs>
    <linearGradient id="rdBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282c34"/>
      <stop offset="1" stop-color="#21252b"/>
    </linearGradient>
    <marker id="rdArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#5c6370" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="640" height="300" rx="10" fill="url(#rdBg)"/>
  <text x="24" y="34" font-family="monospace" font-size="15" fill="#abb2bf">01 分数规划：g(L) 单调降，零点即最优比率</text>

  <!-- 可行 / 不可行 区底色 -->
  <polygon points="100,210 130,75 200,110 260,150 310,185 340,210" fill="#98c379" fill-opacity="0.08"/>
  <polygon points="340,210 390,235 460,252 540,262 540,210" fill="#e06c75" fill-opacity="0.08"/>

  <!-- 坐标轴 -->
  <line x1="100" y1="50" x2="100" y2="250" stroke="#5c6370" stroke-width="1.5"/>
  <line x1="100" y1="210" x2="560" y2="210" stroke="#5c6370" stroke-width="1.5" marker-end="url(#rdArrow)"/>
  <text x="108" y="56" font-family="monospace" font-size="12" fill="#5c6370">g(L) = max Σ(a − L·b)</text>
  <text x="556" y="232" font-family="monospace" font-size="12" fill="#5c6370">L</text>

  <!-- 曲线 -->
  <polyline points="130,75 200,110 260,150 310,185 340,210 390,235 460,252 540,262"
            fill="none" stroke="#61afef" stroke-width="2.5"/>

  <!-- 二分试探点 -->
  <line x1="215" y1="120" x2="215" y2="210" stroke="#98c379" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="215" cy="120" r="5" fill="#98c379"/>
  <text x="226" y="116" font-family="monospace" font-size="11" fill="#98c379">g > 0 → lo = mid</text>
  <line x1="425" y1="244" x2="425" y2="210" stroke="#e06c75" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="425" cy="244" r="5" fill="#e06c75"/>
  <text x="400" y="196" font-family="monospace" font-size="11" fill="#e06c75">g &lt; 0 → hi = mid</text>

  <!-- 零点 -->
  <line x1="340" y1="210" x2="340" y2="238" stroke="#e5c07b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="340" cy="210" r="5" fill="#e5c07b"/>
  <text x="340" y="258" font-family="monospace" font-size="12" fill="#e5c07b" text-anchor="middle">最优比率 L*</text>

  <text x="40" y="288" font-family="monospace" font-size="13" fill="#abb2bf">g(mid) ≥ 0 ⇔ 存在选法使 Σa/Σb ≥ mid：往右收，反之往左收</text>
</svg>
