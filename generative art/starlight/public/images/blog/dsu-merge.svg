<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="并查集合并与路径压缩示意">
  <defs>
    <linearGradient id="dmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282c34"/>
      <stop offset="1" stop-color="#21252b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="300" rx="10" fill="url(#dmBg)"/>
  <text x="24" y="34" font-family="monospace" font-size="15" fill="#abb2bf">合并两伙人 = 把小树的根接到大树的根上</text>

  <!-- 左树（根 3，孩子们） -->
  <g font-family="monospace" font-size="13" text-anchor="middle">
    <circle cx="150" cy="90" r="17" fill="#61afef"/><text x="150" y="95" fill="#282c34">3</text>
    <circle cx="100" cy="150" r="17" fill="#3a3f4b"/><text x="100" y="155" fill="#abb2bf">1</text>
    <circle cx="200" cy="150" r="17" fill="#3a3f4b"/><text x="200" y="155" fill="#abb2bf">5</text>
    <circle cx="70" cy="205" r="17" fill="#3a3f4b"/><text x="70" y="210" fill="#abb2bf">2</text>
    <line x1="143" y1="104" x2="106" y2="138" stroke="#5c6370" stroke-width="2"/>
    <line x1="157" y1="104" x2="194" y2="138" stroke="#5c6370" stroke-width="2"/>
    <line x1="93" y1="163" x2="77" y2="192" stroke="#5c6370" stroke-width="2"/>
    <text x="150" y="60" fill="#61afef">root = 3</text>
  </g>

  <!-- 右树（根 8） -->
  <g font-family="monospace" font-size="13" text-anchor="middle">
    <circle cx="430" cy="90" r="17" fill="#c678dd"/><text x="430" y="95" fill="#282c34">8</text>
    <circle cx="480" cy="150" r="17" fill="#3a3f4b"/><text x="480" y="155" fill="#abb2bf">6</text>
    <line x1="437" y1="104" x2="473" y2="138" stroke="#5c6370" stroke-width="2"/>
    <text x="430" y="60" fill="#c678dd">root = 8</text>
  </g>

  <!-- 合并箭头 -->
  <path d="M445 105 Q480 230 260 235 Q215 236 172 214" fill="none" stroke="#98c379" stroke-width="2.5" stroke-dasharray="7 5"/>
  <path d="M176 222 l-12 -4 6 -11" fill="none" stroke="#98c379" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="252" y="254" fill="#98c379" font-family="monospace" font-size="13">unite(2, 6)：find(2)=3，find(6)=8，小的挂大的</text>

  <!-- 右侧要点 -->
  <g font-family="monospace" font-size="13">
    <text x="520" y="90" fill="#abb2bf">sz[3]=4</text>
    <text x="520" y="112" fill="#abb2bf">&gt; sz[8]=2</text>
    <text x="520" y="140" fill="#e5c07b">→ 8 挂到 3 下</text>
  </g>

  <!-- 底部：路径压缩 -->
  <g font-family="monospace" font-size="13">
    <text x="235" y="185" fill="#5c6370">└ 2 → 1 → 3（找根要两跳）</text>
    <text x="60" y="280" fill="#e5c07b">find(2) 顺带把 2 直接指到 3 —— 下次一跳到位（路径压缩）</text>
  </g>
</svg>
