<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="KMP next 数组与 border 示意">
  <defs>
    <linearGradient id="kpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282c34"/>
      <stop offset="1" stop-color="#21252b"/>
    </linearGradient>
    <marker id="kpArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#e5c07b" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="640" height="300" rx="10" fill="url(#kpBg)"/>
  <text x="24" y="34" font-family="monospace" font-size="15" fill="#abb2bf">KMP 的 next：前缀 i 的最长相等前后缀（border）</text>

  <!-- 字符格 -->
  <g font-family="monospace" font-size="16" text-anchor="middle">
    <rect x="120" y="62" width="64" height="40" rx="6" fill="#61afef" fill-opacity="0.18" stroke="#61afef" stroke-opacity="0.5"/>
    <rect x="200" y="62" width="64" height="40" rx="6" fill="#98c379" fill-opacity="0.18" stroke="#98c379" stroke-opacity="0.5"/>
    <rect x="280" y="62" width="64" height="40" rx="6" fill="#61afef" fill-opacity="0.18" stroke="#61afef" stroke-opacity="0.5"/>
    <rect x="360" y="62" width="64" height="40" rx="6" fill="#98c379" fill-opacity="0.18" stroke="#98c379" stroke-opacity="0.5"/>
    <rect x="440" y="62" width="64" height="40" rx="6" fill="#21252b" stroke="#3a3f4b"/>
    <text x="152" y="88" fill="#61afef">A</text>
    <text x="232" y="88" fill="#98c379">B</text>
    <text x="312" y="88" fill="#61afef">A</text>
    <text x="392" y="88" fill="#98c379">B</text>
    <text x="472" y="88" fill="#abb2bf">C</text>
  </g>
  <g font-family="monospace" font-size="11" fill="#5c6370" text-anchor="middle">
    <text x="152" y="120">i=1</text><text x="232" y="120">2</text><text x="312" y="120">3</text>
    <text x="392" y="120">4</text><text x="472" y="120">5</text>
  </g>

  <!-- next 行 -->
  <g font-family="monospace" font-size="14" text-anchor="middle">
    <rect x="120" y="136" width="64" height="32" rx="6" fill="#21252b" stroke="#3a3f4b"/>
    <rect x="200" y="136" width="64" height="32" rx="6" fill="#21252b" stroke="#3a3f4b"/>
    <rect x="280" y="136" width="64" height="32" rx="6" fill="#21252b" stroke="#3a3f4b"/>
    <rect x="360" y="136" width="64" height="32" rx="6" fill="#21252b" stroke="#3a3f4b"/>
    <rect x="440" y="136" width="64" height="32" rx="6" fill="#21252b" stroke="#3a3f4b"/>
    <text x="152" y="157" fill="#e5c07b">0</text>
    <text x="232" y="157" fill="#e5c07b">0</text>
    <text x="312" y="157" fill="#e5c07b">1</text>
    <text x="392" y="157" fill="#e5c07b">2</text>
    <text x="472" y="157" fill="#e5c07b">0</text>
  </g>
  <text x="520" y="157" font-family="monospace" font-size="12" fill="#5c6370">← next[i]</text>

  <!-- 失配跳转弧线：4 → 2 -->
  <path d="M 392 168 C 392 196, 232 196, 232 168" fill="none" stroke="#e5c07b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#kpArrow)"/>
  <text x="312" y="206" font-family="monospace" font-size="11" fill="#e5c07b" text-anchor="middle">失配：j 跳 next[j]</text>

  <!-- 解释 -->
  <g font-family="monospace" font-size="13">
    <text x="40" y="238" fill="#98c379">前缀 ABAB 的 border = AB（两个绿格），长度 2 = next[4]</text>
    <text x="40" y="260" fill="#61afef">前缀 ABA 的 border = A（两个蓝格），长度 1 = next[3]</text>
    <text x="40" y="288" fill="#abb2bf">后缀换前缀：文本指针永不回退，复杂度均摊 O(n+m)</text>
  </g>
</svg>
