<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="单调栈管辖范围与合法左端点示意">
  <defs>
    <linearGradient id="mspBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282c34"/>
      <stop offset="1" stop-color="#21252b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="300" rx="10" fill="url(#mspBg)"/>
  <text x="24" y="34" font-family="monospace" font-size="15" fill="#abb2bf">a = [2, 1, 4, 3, 5, 2]　求 max(区间) = 区间长度 的子数组</text>
  <!-- 柱状图 -->
  <g font-family="monospace" font-size="13" text-anchor="middle">
    <rect x="80"  y="190" width="52" height="40"  rx="4" fill="#e06c75" opacity="0.85"/><text x="106" y="216" fill="#282c34">2</text>
    <rect x="140" y="220" width="52" height="10"  rx="4" fill="#e5c07b" opacity="0.85"/><text x="166" y="216" fill="#e5c07b">1</text>
    <rect x="200" y="150" width="52" height="80"  rx="4" fill="#98c379" opacity="0.85"/><text x="226" y="196" fill="#282c34">4</text>
    <rect x="260" y="170" width="52" height="60"  rx="4" fill="#61afef" opacity="0.85"/><text x="286" y="206" fill="#282c34">3</text>
    <rect x="320" y="110" width="52" height="120" rx="4" fill="#c678dd" opacity="0.85"/><text x="346" y="176" fill="#282c34">5</text>
    <rect x="380" y="190" width="52" height="40"  rx="4" fill="#56b6c2" opacity="0.85"/><text x="406" y="216" fill="#282c34">2</text>
  </g>
  <g font-family="monospace" font-size="11" fill="#5c6370" text-anchor="middle">
    <text x="106" y="252">1</text><text x="166" y="252">2</text><text x="226" y="252">3</text>
    <text x="286" y="252">4</text><text x="346" y="252">5</text><text x="406" y="252">6</text>
  </g>
  <!-- 位置3（值4）的管辖范围：左侧无更大(L=0)，右侧最近更大是位置5(值5, R=5) -->
  <path d="M72 96 v-10 h288 v10" fill="none" stroke="#98c379" stroke-width="2"/>
  <text x="216" y="82" font-family="monospace" font-size="12" fill="#98c379" text-anchor="middle">p=3（值 k=4）的管辖范围 (0, 5)：位置 1–4</text>
  <!-- 长度为 4 且覆盖 p=3 的区间 [1,4] -->
  <rect x="76" y="102" width="180" height="130" rx="6" fill="none" stroke="#98c379" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="226" y="272" font-family="monospace" font-size="12" fill="#98c379" text-anchor="middle">长度恰为 4 且覆盖 p=3 的区间只有 [1,4] → 贡献 1（max=4 ✓）</text>
  <g font-family="monospace" font-size="12">
    <text x="470" y="110" fill="#abb2bf" text-anchor="start">左边界 L：左侧</text>
    <text x="470" y="128" fill="#abb2bf" text-anchor="start">最近更大元素</text>
    <text x="470" y="152" fill="#abb2bf" text-anchor="start">右边界 R：右侧</text>
    <text x="470" y="170" fill="#abb2bf" text-anchor="start">最近更大元素</text>
    <text x="470" y="198" fill="#56b6c2" text-anchor="start">j ∈ [max(L+1, p−k+1),</text>
    <text x="470" y="216" fill="#56b6c2" text-anchor="start">     min(p, R−k)]</text>
    <text x="470" y="244" fill="#98c379" text-anchor="start">本例 j ∈ [1,1] → 1 个</text>
  </g>
  <text x="24" y="290" font-family="monospace" font-size="11" fill="#5c6370">枚举“谁当最大值”，等值条件就把区间长度锁死成 a[p]</text>
</svg>
