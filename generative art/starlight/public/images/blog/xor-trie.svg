<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="01-Trie 最大异或贪心示意">
  <defs>
    <linearGradient id="xtBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282c34"/>
      <stop offset="1" stop-color="#21252b"/>
    </linearGradient>
    <marker id="xtArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#e5c07b" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="640" height="300" rx="10" fill="url(#xtBg)"/>
  <text x="24" y="34" font-family="monospace" font-size="15" fill="#abb2bf">最长异或路径：前缀异或 + 01-Trie 贪心</text>

  <!-- 左：树与前缀异或 -->
  <g stroke="#3a3f4b" stroke-width="2">
    <line x1="120" y1="80" x2="70"  y2="160"/>
    <line x1="120" y1="80" x2="180" y2="160"/>
  </g>
  <g font-family="monospace" font-size="11" fill="#5c6370">
    <text x="80" y="124">7</text>
    <text x="156" y="120">3</text>
  </g>
  <g font-family="monospace" font-size="13" text-anchor="middle">
    <circle cx="120" cy="80"  r="15" fill="#61afef"/><text x="120" y="85"  fill="#282c34">R</text>
    <circle cx="70"  cy="160" r="15" fill="#98c379"/><text x="70"  y="165" fill="#282c34">1</text>
    <circle cx="180" cy="160" r="15" fill="#98c379"/><text x="180" y="165" fill="#282c34">2</text>
  </g>
  <g font-family="monospace" font-size="12" fill="#abb2bf" text-anchor="middle">
    <text x="70" y="196">d₁ = 7</text>
    <text x="180" y="196">d₂ = 3</text>
  </g>
  <text x="120" y="230" font-family="monospace" font-size="12" fill="#5c6370" text-anchor="middle">路径(1,2) = d₁⊕d₂ = 4</text>

  <!-- 右：01-Trie（存入 3 = 011） -->
  <g stroke="#3a3f4b" stroke-width="1.5">
    <line x1="490" y1="70" x2="400" y2="130"/>
    <line x1="400" y1="130" x2="350" y2="190"/>
    <line x1="350" y1="190" x2="320" y2="250"/>
  </g>
  <line x1="490" y1="70" x2="580" y2="130" stroke="#3a3f4b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g font-family="monospace" font-size="11" fill="#98c379">
    <text x="446" y="92">0</text>
    <text x="546" y="92">1</text>
    <text x="362" y="156">1</text>
    <text x="324" y="216">1</text>
  </g>
  <g font-family="monospace" fill="#21252b">
    <circle cx="490" cy="70"  r="13" fill="#61afef"/>
    <circle cx="400" cy="130" r="13" fill="#61afef"/>
    <circle cx="350" cy="190" r="13" fill="#61afef"/>
    <circle cx="320" cy="250" r="13" fill="#61afef"/>
  </g>
  <circle cx="580" cy="130" r="12" fill="none" stroke="#3a3f4b" stroke-dasharray="4 3"/>
  <text x="340" y="256" font-family="monospace" font-size="12" fill="#98c379">→ 3 (011)</text>
  <text x="600" y="134" font-family="monospace" font-size="10" fill="#5c6370">无</text>

  <!-- 查询 7=111 的贪心路径 -->
  <g stroke="#e5c07b" stroke-width="2.5" fill="none">
    <line x1="490" y1="70" x2="400" y2="130" marker-end="url(#xtArrow)"/>
    <line x1="400" y1="130" x2="350" y2="190" marker-end="url(#xtArrow)"/>
    <line x1="350" y1="190" x2="320" y2="250" marker-end="url(#xtArrow)"/>
  </g>

  <g font-family="monospace" font-size="13">
    <text x="380" y="284" fill="#e5c07b">查询 7(111)：每层想走与位相反的孩子</text>
    <text x="24" y="284" fill="#abb2bf">d[u] = 根到 u 边权异或和</text>
  </g>
</svg>
