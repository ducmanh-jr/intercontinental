<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="二分答案边界示意">
  <defs>
    <linearGradient id="bsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282c34"/>
      <stop offset="1" stop-color="#21252b"/>
    </linearGradient>
    <marker id="bsArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#5c6370" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="640" height="300" rx="10" fill="url(#bsBg)"/>
  <text x="24" y="34" font-family="monospace" font-size="15" fill="#abb2bf">二分答案：check(d) 的结果随 d 单调，找边界</text>
  <text x="24" y="60" font-family="monospace" font-size="12" fill="#5c6370">check(d) = 「每对差都 ≤ d 能否完成全部配对」</text>

  <!-- 答案格：左 ✗ 右 ✓ -->
  <g font-family="monospace" font-size="16" text-anchor="middle">
    <g fill="#e06c75" fill-opacity="0.14" stroke="#e06c75" stroke-opacity="0.45">
      <rect x="32"  y="112" width="46" height="44" rx="6"/>
      <rect x="80"  y="112" width="46" height="44" rx="6"/>
      <rect x="128" y="112" width="46" height="44" rx="6"/>
      <rect x="176" y="112" width="46" height="44" rx="6"/>
      <rect x="224" y="112" width="46" height="44" rx="6"/>
    </g>
    <g fill="#98c379" fill-opacity="0.14" stroke="#98c379" stroke-opacity="0.45">
      <rect x="272" y="112" width="46" height="44" rx="6"/>
      <rect x="320" y="112" width="46" height="44" rx="6"/>
      <rect x="368" y="112" width="46" height="44" rx="6"/>
      <rect x="416" y="112" width="46" height="44" rx="6"/>
      <rect x="464" y="112" width="46" height="44" rx="6"/>
      <rect x="512" y="112" width="46" height="44" rx="6"/>
      <rect x="560" y="112" width="46" height="44" rx="6"/>
    </g>
    <g fill="#e06c75">
      <text x="55"  y="140">✗</text><text x="103" y="140">✗</text><text x="151" y="140">✗</text>
      <text x="199" y="140">✗</text><text x="247" y="140">✗</text>
    </g>
    <g fill="#98c379">
      <text x="295" y="140">✓</text><text x="343" y="140">✓</text><text x="391" y="140">✓</text>
      <text x="439" y="140">✓</text><text x="487" y="140">✓</text><text x="535" y="140">✓</text><text x="583" y="140">✓</text>
    </g>
  </g>

  <!-- 边界 -->
  <line x1="270" y1="96" x2="270" y2="172" stroke="#e5c07b" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="270" y="88" font-family="monospace" font-size="13" fill="#e5c07b" text-anchor="middle">答案 = 第一个 ✓</text>

  <!-- d 轴 -->
  <line x1="32" y1="192" x2="606" y2="192" stroke="#5c6370" stroke-width="1.5" marker-end="url(#bsArrow)"/>
  <text x="606" y="214" font-family="monospace" font-size="12" fill="#5c6370" text-anchor="end">上限 d 增大</text>

  <!-- 二分过程 -->
  <g font-family="monospace" font-size="13">
    <text x="60" y="246" fill="#abb2bf">lo=1, hi=12 → mid=6 是 ✓ → hi=6</text>
    <text x="60" y="268" fill="#abb2bf">→ mid=3 是 ✗ → lo=4 …… 直到 lo==hi</text>
    <text x="60" y="290" fill="#98c379">check 单调 ⇒ 只需 O(log D) 次判定，每次 O(n) 双指针</text>
  </g>
</svg>
