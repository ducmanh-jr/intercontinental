<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="最高分叉位决胜示意图">
  <defs>
    <linearGradient id="xhBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282c34"/>
      <stop offset="1" stop-color="#21252b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="320" rx="10" fill="url(#xhBg)"/>
  <text x="24" y="34" font-family="monospace" font-size="15" fill="#abb2bf">例子：x = 01011（11），y = 11010（26）——最高分叉位 k = 4</text>

  <!-- 二进制位图 -->
  <g font-family="monospace" font-size="16" text-anchor="middle">
    <!-- x 行 -->
    <text x="90" y="80" fill="#5c6370" text-anchor="end">x</text>
    <rect x="110" y="62" width="34" height="26" rx="4" fill="#e06c75" opacity="0.9"/><text x="127" y="81" fill="#282c34">0</text>
    <rect x="150" y="62" width="34" height="26" rx="4" fill="#3a3f4b"/><text x="167" y="81" fill="#abb2bf">1</text>
    <rect x="190" y="62" width="34" height="26" rx="4" fill="#3a3f4b"/><text x="207" y="81" fill="#abb2bf">0</text>
    <rect x="230" y="62" width="34" height="26" rx="4" fill="#3a3f4b"/><text x="247" y="81" fill="#abb2bf">1</text>
    <rect x="270" y="62" width="34" height="26" rx="4" fill="#3a3f4b"/><text x="287" y="81" fill="#abb2bf">1</text>

    <!-- y 行 -->
    <text x="90" y="124" fill="#5c6370" text-anchor="end">y</text>
    <rect x="110" y="106" width="34" height="26" rx="4" fill="#98c379" opacity="0.9"/><text x="127" y="125" fill="#282c34">1</text>
    <rect x="150" y="106" width="34" height="26" rx="4" fill="#3a3f4b"/><text x="167" y="125" fill="#abb2bf">1</text>
    <rect x="190" y="106" width="34" height="26" rx="4" fill="#3a3f4b"/><text x="207" y="125" fill="#abb2bf">0</text>
    <rect x="230" y="106" width="34" height="26" rx="4" fill="#3a3f4b"/><text x="247" y="125" fill="#abb2bf">1</text>
    <rect x="270" y="106" width="34" height="26" rx="4" fill="#3a3f4b"/><text x="287" y="125" fill="#abb2bf">0</text>

    <!-- 分叉位标注 -->
    <path d="M127 148 v14" stroke="#61afef" stroke-width="2"/>
    <text x="127" y="180" fill="#61afef" font-size="12">k=4</text>
  </g>

  <!-- 构造 n -->
  <g font-family="monospace" font-size="14">
    <text x="360" y="80" fill="#e5c07b">取 n = 1&lt;&lt;k = 10000</text>
    <text x="360" y="110" fill="#abb2bf">x ⊕ n = 11011 （k 位翻成 1）</text>
    <text x="360" y="140" fill="#abb2bf">y ⊕ n = 01010 （k 位翻成 0）</text>
    <text x="360" y="172" fill="#98c379">高位 1 &gt; 0 ⇒ x⊕n &gt; y⊕n ✓</text>
  </g>

  <!-- 结论 -->
  <g font-family="monospace" font-size="13">
    <rect x="60" y="208" width="520" height="88" rx="8" fill="#21252b" stroke="#3a3f4b"/>
    <text x="80" y="234" fill="#c678dd">原理：两个数的比较由最高的不同位决定。</text>
    <text x="80" y="260" fill="#abb2bf">x⊕n 与 y⊕n 在 k 位以下可以随便变，但 k 位上</text>
    <text x="80" y="284" fill="#abb2bf">一个翻成 1、一个翻成 0——高低立判，其余位不用管。</text>
  </g>
  <text x="24" y="310" font-family="monospace" font-size="11" fill="#5c6370">代码：t = x^y; k = 31-__builtin_clz(t); n = x&gt;&gt;k&amp;1 ? 0 : 1&lt;&lt;k</text>
</svg>
