<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="多源 Dijkstra 势力范围示意">
  <defs>
    <linearGradient id="msBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282c34"/>
      <stop offset="1" stop-color="#21252b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="300" rx="10" fill="url(#msBg)"/>
  <!-- 两个势力范围（淡色圆域） -->
  <circle cx="170" cy="150" r="105" fill="#61afef" opacity="0.08"/>
  <circle cx="470" cy="150" r="105" fill="#c678dd" opacity="0.08"/>
  <circle cx="170" cy="150" r="105" fill="none" stroke="#61afef" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
  <circle cx="470" cy="150" r="105" fill="none" stroke="#c678dd" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
  <!-- 普通节点 -->
  <g font-family="monospace" font-size="12" text-anchor="middle">
    <circle cx="110" cy="100" r="14" fill="#21252b" stroke="#61afef"/><text x="110" y="105" fill="#61afef">a</text>
    <circle cx="230" cy="90"  r="14" fill="#21252b" stroke="#61afef"/><text x="230" y="95"  fill="#61afef">b</text>
    <circle cx="120" cy="210" r="14" fill="#21252b" stroke="#61afef"/><text x="120" y="215" fill="#61afef">c</text>
    <circle cx="250" cy="200" r="14" fill="#21252b" stroke="#61afef"/><text x="250" y="205" fill="#61afef">u</text>
    <circle cx="400" cy="95"  r="14" fill="#21252b" stroke="#c678dd"/><text x="400" y="100" fill="#c678dd">d</text>
    <circle cx="520" cy="105" r="14" fill="#21252b" stroke="#c678dd"/><text x="520" y="110" fill="#c678dd">e</text>
    <circle cx="390" cy="205" r="14" fill="#21252b" stroke="#c678dd"/><text x="390" y="210" fill="#c678dd">v</text>
    <circle cx="520" cy="205" r="14" fill="#21252b" stroke="#c678dd"/><text x="520" y="210" fill="#c678dd">f</text>
  </g>
  <!-- 源点 -->
  <g font-family="monospace" font-size="13" text-anchor="middle">
    <circle cx="170" cy="150" r="17" fill="#61afef"/><text x="170" y="155" fill="#282c34">s1</text>
    <circle cx="470" cy="150" r="17" fill="#c678dd"/><text x="470" y="155" fill="#282c34">s2</text>
  </g>
  <!-- 普通边 -->
  <g stroke="#5c6370" stroke-width="1.5">
    <line x1="184" y1="140" x2="222" y2="98"/>
    <line x1="176" y1="163" x2="238" y2="196"/>
    <line x1="124" y1="112" x2="158" y2="138"/>
    <line x1="130" y1="200" x2="158" y2="168"/>
    <line x1="414" y1="104" x2="508" y2="103"/>
    <line x1="404" y1="200" x2="508" y2="203"/>
    <line x1="470" y1="133" x2="410" y2="105"/>
    <line x1="470" y1="167" x2="398" y2="194"/>
  </g>
  <!-- 交界边 u—v：松弛失败 → 候选答案 -->
  <line x1="264" y1="200" x2="376" y2="206" stroke="#98c379" stroke-width="3"/>
  <text x="320" y="240" font-family="monospace" font-size="13" fill="#98c379" text-anchor="middle">松弛失败 = 两域交界</text>
  <text x="320" y="262" font-family="monospace" font-size="13" fill="#98c379" text-anchor="middle">ans = dist[u] + w + dist[v]</text>
  <text x="24" y="34" font-family="monospace" font-size="15" fill="#abb2bf">多源 Dijkstra：k 个源同跑，src[] 记录归属</text>
  <text x="24" y="288" font-family="monospace" font-size="11" fill="#5c6370">src[u] ≠ src[v] 的那条边，就是连接两个不同特殊点的桥</text>
</svg>
