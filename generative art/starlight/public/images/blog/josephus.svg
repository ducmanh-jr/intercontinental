<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="约瑟夫环递推示意">
  <defs>
    <linearGradient id="joBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282c34"/>
      <stop offset="1" stop-color="#21252b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="320" rx="10" fill="url(#joBg)"/>
  <text x="24" y="34" font-family="monospace" font-size="15" fill="#abb2bf">约瑟夫环：n=5, m=3 的淘汰轨迹与递推</text>

  <!-- 左：环形淘汰（n=5 编号 1..5，报 3 淘汰：3→1→5→2→4? 模拟：圈[1,2,3,4,5] 从1报数: 3出；从4报:1出；从2报:5出；从3报:2出；幸存4） -->
  <g font-family="monospace" font-size="13" text-anchor="middle">
    <circle cx="150" cy="140" r="72" fill="none" stroke="#3a3f4b" stroke-width="2"/>
    <!-- 5 个位置 -->
    <circle cx="150" cy="68"  r="18" fill="#3a3f4b"/><text x="150" y="73" fill="#abb2bf">1</text>
    <circle cx="219" cy="118" r="18" fill="#3a3f4b"/><text x="219" y="123" fill="#abb2bf">2</text>
    <circle cx="192" cy="196" r="18" fill="#e06c75"/><text x="192" y="201" fill="#282c34">3</text>
    <circle cx="108" cy="196" r="18" fill="#61afef"/><text x="108" y="201" fill="#282c34">4</text>
    <circle cx="81"  cy="118" r="18" fill="#3a3f4b"/><text x="81" y="123" fill="#abb2bf">5</text>
    <!-- 淘汰标记 -->
    <g font-size="11" fill="#e06c75">
      <text x="192" y="228">✕ 第1个出</text>
      <text x="196" y="52" fill="#e5c07b">✕ 第2个出</text>
      <text x="52" y="94" fill="#e5c07b">✕ 第3个出</text>
      <text x="219" y="94" fill="#98c379">✕ 第4个出</text>
    </g>
    <text x="108" y="228" fill="#61afef">幸存者!</text>
  </g>

  <!-- 右：递推解释 -->
  <g font-family="monospace" font-size="13">
    <text x="340" y="80" fill="#abb2bf">把「谁活下来」看成编号函数：</text>
    <text x="340" y="108" fill="#e5c07b">f(1) = 0（只剩 1 人，下标 0）</text>
    <text x="340" y="136" fill="#98c379">f(n) = (f(n−1) + m) mod n</text>
    <text x="340" y="164" fill="#abb2bf">f(2)=(0+3)%2=1</text>
    <text x="340" y="184" fill="#abb2bf">f(3)=(1+3)%3=1</text>
    <text x="340" y="204" fill="#abb2bf">f(4)=(1+3)%4=0</text>
    <text x="340" y="224" fill="#abb2bf">f(5)=(0+3)%5=3 → 编号 4 ✓</text>
    <text x="340" y="258" fill="#c678dd">直觉：n−1 规模的幸存者位置，</text>
    <text x="340" y="278" fill="#c678dd">在 n 规模里整体平移了 m 位。</text>
    <text x="340" y="304" fill="#5c6370">O(n) 递推替代 O(nm) 模拟</text>
  </g>
</svg>
