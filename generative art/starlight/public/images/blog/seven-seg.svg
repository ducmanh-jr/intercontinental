<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-label="七段数码管状态压缩示意">
  <defs>
    <linearGradient id="ssBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282c34"/>
      <stop offset="1" stop-color="#21252b"/>
    </linearGradient>
  </defs>
  <rect width="680" height="340" rx="10" fill="url(#ssBg)"/>
  <text x="24" y="34" font-family="monospace" font-size="15" fill="#abb2bf">把"数字需要点亮哪些段"压成一个 7 位二进制数</text>

  <!-- 七段数码管（数字 8 全亮） -->
  <g stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="120" y1="80"  x2="180" y2="80"  stroke="#e06c75"/>
    <line x1="190" y1="90"  x2="190" y2="140" stroke="#e5c07b"/>
    <line x1="190" y1="160" x2="190" y2="210" stroke="#98c379"/>
    <line x1="120" y1="220" x2="180" y2="220" stroke="#56b6c2"/>
    <line x1="110" y1="160" x2="110" y2="210" stroke="#61afef"/>
    <line x1="110" y1="90"  x2="110" y2="140" stroke="#c678dd"/>
    <line x1="120" y1="150" x2="180" y2="150" stroke="#d19a66"/>
  </g>
  <g font-family="monospace" font-size="12" fill="#5c6370">
    <text x="150" y="70" text-anchor="middle">bit0</text>
    <text x="205" y="118">bit1</text>
    <text x="205" y="190">bit2</text>
    <text x="150" y="242" text-anchor="middle">bit3</text>
    <text x="86" y="190" text-anchor="end">bit4</text>
    <text x="86" y="118" text-anchor="end">bit5</text>
    <text x="150" y="142" text-anchor="middle">bit6</text>
  </g>

  <!-- 编码表（竖排，杜绝重叠） -->
  <g font-family="monospace" font-size="14">
    <text x="320" y="82" fill="#abb2bf">数字 1 → 只亮 bit1、bit2</text>
    <text x="320" y="106" fill="#98c379">S[1] = 1000110₂</text>
    <text x="320" y="140" fill="#abb2bf">数字 7 → 亮 bit0、bit1、bit2</text>
    <text x="320" y="164" fill="#98c379">S[7] = 0000111₂</text>
    <text x="320" y="198" fill="#abb2bf">数字 8 → 全亮</text>
    <text x="320" y="222" fill="#98c379">S[8] = 1111111₂</text>
  </g>

  <!-- 概率一行 -->
  <g font-family="monospace" font-size="13">
    <text x="320" y="252" fill="#abb2bf">单数字概率：</text>
    <text x="320" y="272" fill="#e5c07b">P(d) = p^亮段数 × (1−p)^(7−亮段数)</text>
  </g>

  <!-- 结论框（整宽，两行短句） -->
  <g font-family="monospace" font-size="13">
    <rect x="60" y="292" width="560" height="36" rx="8" fill="#21252b" stroke="#3a3f4b"/>
    <text x="80" y="315" fill="#c678dd">显示器独立 ⇒ 四位数概率 = 各位概率之积；模下除法用逆元 a/b ≡ a·b^(mod−2)</text>
  </g>
</svg>
