<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="高精度竖式加法示意">
  <defs>
    <linearGradient id="bgCol" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282c34"/>
      <stop offset="1" stop-color="#21252b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="300" rx="10" fill="url(#bgCol)"/>
  <text x="24" y="34" font-family="monospace" font-size="15" fill="#abb2bf">高精度加法 = 小学竖式：879 + 458 = 1337</text>

  <!-- 进位行 -->
  <g font-family="monospace" font-size="12" fill="#e06c75" text-anchor="middle">
    <text x="350" y="76">1</text>
    <text x="410" y="76">1</text>
  </g>

  <!-- 个位列高亮 -->
  <rect x="444" y="86" width="52" height="86" fill="#98c379" fill-opacity="0.08"/>
  <text x="470" y="244" font-family="monospace" font-size="11" fill="#98c379" text-anchor="middle">个位 = vec[0]</text>

  <!-- 被加数 -->
  <g font-family="monospace" font-size="16" text-anchor="middle" fill="#abb2bf">
    <rect x="324" y="88" width="52" height="34" rx="5" fill="#21252b" stroke="#3a3f4b"/>
    <rect x="384" y="88" width="52" height="34" rx="5" fill="#21252b" stroke="#3a3f4b"/>
    <rect x="444" y="88" width="52" height="34" rx="5" fill="#21252b" stroke="#3a3f4b"/>
    <text x="350" y="110">8</text><text x="410" y="110">7</text><text x="470" y="110">9</text>
  </g>
  <!-- 加数 -->
  <g font-family="monospace" font-size="16" text-anchor="middle" fill="#abb2bf">
    <rect x="324" y="130" width="52" height="34" rx="5" fill="#21252b" stroke="#3a3f4b"/>
    <rect x="384" y="130" width="52" height="34" rx="5" fill="#21252b" stroke="#3a3f4b"/>
    <rect x="444" y="130" width="52" height="34" rx="5" fill="#21252b" stroke="#3a3f4b"/>
    <text x="350" y="152">4</text><text x="410" y="152">5</text><text x="470" y="152">8</text>
  </g>
  <!-- 分隔线 -->
  <line x1="240" y1="178" x2="500" y2="178" stroke="#5c6370" stroke-width="1.5"/>
  <!-- 和 -->
  <g font-family="monospace" font-size="16" text-anchor="middle" fill="#98c379">
    <rect x="264" y="186" width="52" height="34" rx="5" fill="#21252b" stroke="#98c379" stroke-opacity="0.4"/>
    <rect x="324" y="186" width="52" height="34" rx="5" fill="#21252b" stroke="#3a3f4b"/>
    <rect x="384" y="186" width="52" height="34" rx="5" fill="#21252b" stroke="#3a3f4b"/>
    <rect x="444" y="186" width="52" height="34" rx="5" fill="#21252b" stroke="#3a3f4b"/>
    <text x="290" y="208">1</text><text x="350" y="208">3</text><text x="410" y="208">3</text><text x="470" y="208">7</text>
  </g>

  <g font-family="monospace" font-size="13">
    <text x="40" y="264" fill="#e5c07b">倒序存储，进位 carry = d / 10，本位 d %= 10</text>
    <text x="40" y="288" fill="#5c6370">减法换借位，乘法错位卷积（i+j），除法从高位试商</text>
  </g>
</svg>
